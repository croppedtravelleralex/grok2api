[package]
name = "web_http_chat_image_canary_rs"
version = "0.1.0"
edition = "2021"
description = "Rust orchestrator: concurrent A∥C (+ multi-account). TLS via curl_cffi workers; sign via frozen v1 Playwright helper."
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
