[package]
name = "chrome_ticket_probe_rs"
version = "0.1.0"
edition = "2021"
description = "Unified pool probes (dispatch/normal/ticket-quota/readiness) with single SSH IO batch"
publish = false

[[bin]]
name = "chrome_ticket_probe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
