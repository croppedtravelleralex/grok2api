name: grok2api

services:
  grok2api:
    container_name: grok2api
    image: "${GROK2API_IMAGE:-ghcr.io/croppedtravelleralex/grok2api@sha256:4764cf41257a10b8f10599c26d661e2e3a366a73be4beb44057b266dcad79ece}"
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      TZ: Asia/Shanghai
      # 纯 HTTP Lite 默认不启用浏览器桥；故障清障时才显式传入 bridge URL。
      GROK2API_BROWSER_BRIDGE_URL: "${GROK2API_BROWSER_BRIDGE_URL:-}"
      GROK2API_BROWSER_BRIDGE_KEY_FILE: /run/secrets/browser-bridge-key
      GROK2API_WEB_QUOTA_STARTUP_LIMIT: "0"
      GROK2API_WEB_QUOTA_CATCHUP_LIMIT: "1"
      GROK2API_WEB_QUOTA_CATCHUP_INITIAL_DELAY: "1h"
      GROK2API_WEB_QUOTA_CATCHUP_EVERY: "6h"
      GROK2API_BUILD_CHAT_PROBE_INITIAL_DELAY: "2m"
      GROK2API_BUILD_CHAT_PROBE_EVERY: "30s"
      GROK2API_BUILD_CHAT_PROBE_IDLE_EVERY: "5m"
      # 安全删除：true=两阶段后物理删除；false=仅标记。面板开关可覆盖，重启以本变量为准。
      GROK2API_BUILD_SAFE_PURGE_APPLY: "${GROK2API_BUILD_SAFE_PURGE_APPLY:-true}"
    volumes:
      - /opt/grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - /opt/grok2api/data:/app/data
      - /root/.secrets/grok2api-browser-bridge-key-main:/run/secrets/browser-bridge-key:ro
    restart: unless-stopped
    init: true
    cpus: "0.75"
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  browser-bridge:
    container_name: grok2api-browser-bridge
    image: grok2api-browser-bridge:chrome146
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: warning
      BRIDGE_KEY_FILE: /run/secrets/browser-bridge-key
      BRIDGE_SESSION_LIMIT: "1"
      BRIDGE_SESSION_TTL_SECONDS: "1800"
      BRIDGE_CLOSE_TIMEOUT_SECONDS: "2"
      BRIDGE_MAX_OPERATION_SECONDS: "90"
      BRIDGE_BOOTSTRAP_SECONDS: "30"
      BRIDGE_OPERATION_GRACE_SECONDS: "2"
      BRIDGE_REUSE_SESSIONS: "true"
      BRIDGE_THREADS: "2"
      BRIDGE_WARM_USER_AGENT: "false"
    volumes:
      - /root/.secrets/grok2api-browser-bridge-key:/run/secrets/browser-bridge-key:ro
      - /opt/grok2api/browser-bridge/app.py:/bridge/app.py:ro
    restart: unless-stopped
    init: true
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 256
    shm_size: 512m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8192/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
